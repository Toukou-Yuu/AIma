# AIma 核心配置模板
# 用法：
#   1. 复制本文件为 aima_kernel.yaml
#   2. 填入你的 API Key
#   3. 运行：python -m llm --config configs/aima_kernel.yaml
#
# 注意：aima_kernel.yaml 已被 gitignore，不会提交到仓库

# ==================== 内核规则配置 ====================
kernel:
  # === 对局形式 ===
  # match_length: 对局长度，hanchan（半庄战，东+南各4局）或 tonpuusen（东风战，仅东场4局）
  match_length: hanchan

  # starting_points: 起配点（雀魂标准 25000）
  starting_points: 25000

  # round_wind_count: 场风圈数（东场=1，东+南场=2）
  round_wind_count: 2

  # === 鸣牌与役 ===
  # allow_open_tanyao: 食断あり，副露后断幺九可算役
  allow_open_tanyao: true

  # allow_multiple_ron: 一炮多响あり，多家同时荣和
  allow_multiple_ron: true

  # === 宝牌 ===
  # red_dora_enabled: 赤牌あり，三赤（5m/5p/5s 各1张赤牌）
  red_dora_enabled: true

  # ura_dora_enabled: 里宝牌あり，立直和了时翻开里宝指示牌
  ura_dora_enabled: true

  # === 满贯规则 ===
  # flow_mangan_enabled: 流局满贯あり，荒牌流局时听牌且全舍牌幺九、未被鸣走则按满贯结算
  flow_mangan_enabled: true

  # kiriage_mangan_enabled: 切上满贯あり，3番70符或4番40符按满贯计算
  kiriage_mangan_enabled: true

  # === 其他规则 ===
  # ippatsu_enabled: 一发あり，立直后下一巡内和了可计一发
  ippatsu_enabled: true

  # west_round_enabled: 西入あり，半庄战南场结束后若亲家听牌则进入西场（本项目暂不实现）
  west_round_enabled: false

  # riichi_stick_value: 立直棒点数（雀魂标准 1000）
  riichi_stick_value: 1000

  # honba_value: 本场费（雀魂标准 300点/场）
  honba_value: 300

  # === 对局控制 ===
  # seed: 随机种子，null 表示随机生成，指定数值可复现牌山
  seed: null

  # wall_file: 自定义牌山 JSON 文件路径（仅支持单局），null 表示随机生成
  wall_file: null

  # match_end: 对局结束条件
  match_end:
    # type: 结束类型，hands（固定局数）、rounds（固定轮数）、points（点数阈值）
    type: hands
    # value: 结束值，hands=局数，rounds=轮数，points=点数阈值
    value: 8
    # allow_negative: 是否允许负分继续（雀魂标准 false）
    allow_negative: false

# ==================== LLM 服务配置 ====================
llm:
  # Prompt 格式选择：natural（中文自然语言）或 json（结构化）
  # natural：始终使用自然语言观测，不再在局中切换为 delta JSON
  # json：使用结构化观测，可配合 delta 帧减少上下文体积
  prompt_format: natural

  # AIma 本地上下文边界：
  # - stateless：只发送当前观测，不注入历史
  # - per_hand：注入本局历史（默认，推荐）
  # - per_match：注入本场前情摘要 + 本局历史
  context_scope: per_hand

  # 历史压缩策略：
  # - none：不压缩
  # - snip：仅裁掉较早记录
  # - micro：裁掉较早记录并压缩单条历史
  # - collapse：折叠较早记录为摘要（默认）
  # - autocompact：高密度折叠较早历史
  compression_level: collapse

  # 历史预算：控制发送给模型的历史窗口大小
  history_budget: 10

  # 上下文压缩触发阈值：prompt tokens + max_tokens 超过 max_context 的该比例时开始压缩
  context_compression_threshold: 0.95

  # 请求间隔（秒）
  request_delay: 0.5

  # LLM 连接 profiles：所有 API / 模型连接必须在这里声明
  profiles:
    default:
      provider: openai
      api_key: "your-api-key-here"  # 必填：填入你的 API Key，或使用 ${OPENAI_API_KEY}
      base_url: "https://api.openai.com/v1"  # OpenAI 官方地址
      # base_url: "http://localhost:11434/v1"  # Ollama 本地地址
      # base_url: "https://api.deepseek.com/v1"  # DeepSeek
      model: "gpt-4o-mini"
      # model: "deepseek-chat"
      # model: "claude-3-5-sonnet-20241022"
      timeout_sec: 120.0
      max_context: 128000
      max_tokens: 1024

    # local_qwen:
    #   provider: openai
    #   base_url: "http://localhost:8080/v1"
    #   api_key: "EMPTY"
    #   model: "Qwen3.5-9B.Q4_K_M"
    #   timeout_sec: 120.0
    #   max_context: 8192
    #   max_tokens: 1024

    # deepseek:
    #   provider: openai
    #   base_url: "https://api.deepseek.com/v1"
    #   api_key: "${DEEPSEEK_API_KEY}"
    #   model: "deepseek-chat"
    #   timeout_sec: 120.0
    #   max_context: 64000
    #   max_tokens: 1024

  # 系统提示词（通用规则，具体格式示例由 user prompt 提供）
  # 注意：prompt_format 决定 user prompt 的格式：
  # - natural：中文自然语言描述，输出 {"action":"打三万","why":"..."}
  # - json：编码格式，输出 {"kind":"discard","seat":0,"tile":"3m","why":"..."}
  system_prompt: |
    你是日式麻将（立直麻将）的牌手代理。你只能从当前提示给出的合法动作中**精确选择一条**执行。

    【核心目标】
    分析手牌结构，计算向听数和进张面，选择能最快接近听牌的行动。

    【牌面编码说明】
    - 万子：1m-9m（如 1m=一万，5m=五万）—— 数字牌，可成顺子
    - 筒子：1p-9p（如 1p=一筒，5p=五筒）—— 数字牌，可成顺子
    - 索子：1s-9s（如 1s=一索，5s=五索）—— 数字牌，可成顺子
    - 字牌：1z=东，2z=南，3z=西，4z=北，5z=白，6z=发，7z=中 —— **无顺序，不可成顺子，只能成刻子/对子**

    【输出规则】
    - 仅输出一行 JSON 对象，禁止 markdown 代码块，禁止 JSON 以外的文字
    - JSON 必须包含字符串字段 ``why``：说明为何选这一手（不超过40字）
    - natural 模式输出 ``action`` 字段，必须与【可选动作】中的某一项完全一致
    - json 模式输出动作字段，必须与 ``legal_actions`` 中某一项完全一致

  # 对话日志配置（用于调试 LLM 上下文）
  conversation_logging:
    enabled: false  # 是否启用对话日志记录
    # 启用后会在 configs/players/{player_id}/conversations/ 下生成 Markdown 文件
    # 文件命名格式：{YYYYMMDD}-{conversation_id}.md
    # 内容格式：类似网页聊天的一问一答（System/User/Assistant）
    # 支持实时查看：tail -f configs/players/{player_id}/conversations/*.md
    # 注意：仅记录真实 AI 对局（dry-run/fallback 不记录）

  # 座位到 LLM profile 的绑定。四个座位必须显式绑定。
  seats:
    seat0:
      profile: default
    seat1:
      profile: default
    seat2:
      profile: default
    seat3:
      profile: default

# ==================== 默认玩家配置 ====================
# 当不指定 --players 时使用的默认玩家
players:
  - id: ichihime
    seat: 0
  - id: yui
    seat: 1
  - id: kavi
    seat: 2
  - id: kana
    seat: 3

# ==================== 日志配置 ====================
logging:
  # 日志级别：DEBUG, INFO, WARNING, ERROR
  level: "INFO"

  # 是否写入文件
  file_output: true

  # 日志目录
  log_dir: "logs"

  # 对局日志输出
  json: null
  session: null
  session_audit: false


# ==================== 观战设置 ====================
watch:
  enabled: false
  delay: 0.3
  show_reason: true

# ==================== 调试选项 ====================
debug:
  verbose: false
  dry_run: false
