experiment:
  id: smoke
  description: "v4 minimal smoke experiment with deterministic non-LLM baselines."
  tags: ["smoke", "v4"]

rules:
  version: "v3.1.3-cleanup"
  scope_file: "RULE_SCOPE.md"

seeds:
  start: 0
  count: 1
  common_walls: true

match:
  preset: hanchan
  max_hands: 8
  allow_negative: false
  step_limit: 20000

runtime:
  mode: serial
  debug_snapshots: false
  no_persist: true
  resume: true
  fail_fast: false

artifacts:
  output_root: runs
  save_replay: true
  save_events: true
  save_decisions: true
  save_prompts: false
  save_debug_snapshots: false
  sqlite_index: true

policies:
  seat0:
    type: first_legal
    id: first_legal_0
    options: {}
  seat1:
    type: first_legal
    id: first_legal_1
    options: {}
  seat2:
    type: first_legal
    id: first_legal_2
    options: {}
  seat3:
    type: first_legal
    id: first_legal_3
    options: {}